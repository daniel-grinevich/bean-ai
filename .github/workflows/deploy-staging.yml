name: Deploy staging to GHCR

# Release a commit to staging by tagging it, e.g. `git tag v1.2.0-staging.1 && git push origin v1.2.0-staging.1`.
on:
  push:
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+-staging*'

# One staging deploy at a time, so manifest bumps land in tag order.
concurrency:
  group: deploy-staging
  cancel-in-progress: false

env:
  REGISTRY: ghcr.io
  IMAGE_PREFIX: ghcr.io/daniel-grinevich/bean-ai

jobs:
  guard:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      short-sha: ${{ steps.sha.outputs.short-sha }}
    steps:
      - name: Checkout Repo
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      # Only ship commits that are already on the default branch.
      - name: Check the tagged commit is on the default branch
        env:
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          if ! git merge-base --is-ancestor "$GITHUB_SHA" "origin/$DEFAULT_BRANCH"; then
            echo "::error::$GITHUB_REF_NAME ($GITHUB_SHA) is not reachable from origin/$DEFAULT_BRANCH; refusing to deploy."
            exit 1
          fi

      - name: Get short SHA
        id: sha
        run: echo "short-sha=$(git rev-parse --short=7 HEAD)" >> "$GITHUB_OUTPUT"

  build-and-push-image:
    needs: guard
    runs-on: ubuntu-24.04-arm
    permissions:
      contents: read
      packages: write
      attestations: write
      id-token: write
    strategy:
      fail-fast: true
      matrix:
        image: [backend, frontend]
    steps:
      - name: Checkout Repo
        uses: actions/checkout@v6

      - name: Log in to the container registry
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Extract metadata (tags, labels) for Docker
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE_PREFIX }}-${{ matrix.image }}
          tags: |
            type=raw,value=staging-latest
            type=raw,value=staging-${{ needs.guard.outputs.short-sha }}
            type=ref,event=tag

      - name: Build and push Docker image
        id: push
        uses: docker/build-push-action@v6
        with:
          context: ./${{ matrix.image }}
          file: ./${{ matrix.image }}/Dockerfile
          platforms: linux/arm64
          push: true
          provenance: false
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=${{ matrix.image }}
          cache-to: type=gha,scope=${{ matrix.image }},mode=max

      - name: Generate artifact attestation
        uses: actions/attest-build-provenance@v4
        with:
          subject-name: ${{ env.IMAGE_PREFIX }}-${{ matrix.image }}
          subject-digest: ${{ steps.push.outputs.digest }}
          push-to-registry: true

  update-manifests:
    needs: [guard, build-and-push-image]
    runs-on: ubuntu-latest
    env:
      SHORT_SHA: ${{ needs.guard.outputs.short-sha }}
      KUSTOMIZATION: staging/bean/kustomization.yaml
    steps:
      - name: Checkout rainbow-road
        uses: actions/checkout@v6
        with:
          repository: daniel-grinevich/rainbow-road
          token: ${{ secrets.RAINBOW_ROAD_PAT }}

      # newTag sits on the line right after its image name (see rainbow-road docs/bean-crumb-temporal.md).
      - name: Update staging image tags
        run: |
          sed -i '/daniel-grinevich\/bean-ai-backend$/{n;s/newTag: .*/newTag: staging-'"$SHORT_SHA"'/;}' "$KUSTOMIZATION"
          sed -i '/daniel-grinevich\/bean-ai-frontend$/{n;s/newTag: .*/newTag: staging-'"$SHORT_SHA"'/;}' "$KUSTOMIZATION"
          test "$(grep -c "newTag: staging-$SHORT_SHA\$" "$KUSTOMIZATION")" -eq 2
          git diff

      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add "$KUSTOMIZATION"
          if git diff --cached --quiet; then
            echo "Already at staging-$SHORT_SHA; nothing to push."
            exit 0
          fi
          git commit -m "deploy bean staging: $SHORT_SHA"
          # Other repos' CI pushes to rainbow-road too; rebase and retry if we lose the race.
          for _ in 1 2 3; do
            git push && exit 0
            git pull --rebase
          done
          exit 1
