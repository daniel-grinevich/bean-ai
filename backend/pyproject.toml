[project]
name = "bean-ai-backend"
version = "0.1.0"
description = "Bean AI agent backend"
authors = [
    { name = "daniel-grinevich", email = "danielvgrinevich@gmail.com" }
]
requires-python = ">=3.13"
dependencies = [
    "fastapi>=0.159.1",
    "pydantic-ai-slim[anthropic]>=2.59.0",
    "pydantic-settings>=2.16.1",
    "uvicorn[standard]>=0.54.0",
]

[build-system]
requires = ["uv_build>=0.13.1,<0.14.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "httpx>=0.28.1",
]
