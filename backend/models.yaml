# Models Bean can use. Loaded and validated at startup (see src/bean_ai_backend/registry.py).
# No secrets here: each provider's API key comes from its env var (anthropic -> ANTHROPIC_API_KEY,
# openrouter -> OPEN_ROUTER_KEY). Point MODELS_FILE at another copy (e.g. a mounted ConfigMap) to change
# the list without rebuilding the image; AGENT_MODEL, if set, overrides `default`.
#
# Per model:
#   id        what the API and the UI use to pick the model
#   label     shown in the model picker
#   provider  anthropic | openrouter
#   model     the provider's model name
#   enabled   false hides it everywhere (default true)
#   settings  passed to Pydantic AI as model settings (max_tokens, temperature, ...)

default: claude-sonnet-5
models:
  - id: claude-sonnet-5
    label: Claude Sonnet 5
    provider: anthropic
    model: claude-sonnet-5
    enabled: true
    settings: {max_tokens: 8192}

  - id: claude-opus-5-5
    label: Claude Opus 5.5
    provider: anthropic
    model: claude-opus-5-5
    enabled: true
    settings: {max_tokens: 8192}

  - id: deepseek/deepseek-v4.1-flash-1017
    label: DeepSeek
    provider: openrouter
    model: deepseek/deepseek-v4.1-flash-1017
    enabled: true
    settings: {max_tokens: 8192}

  - id: z-ai/glm-5.3
    label: GLM 5.3
    provider: openrouter
    model: z-ai/glm-5.3
    enabled: true
    settings: {max_tokens: 8192}
